name: Daily YouTube Pipeline

on:
  schedule:
    - cron: '0 3 * * *'  # 8:30 AM IST = 3:00 AM UTC every day
  workflow_dispatch:       # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ffmpeg (required by yt-dlp for audio extraction)
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r content_Extraction_youtube/requirements.txt

      - name: Run YouTube pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        working-directory: content_Extraction_youtube
        run: python main_once.py
